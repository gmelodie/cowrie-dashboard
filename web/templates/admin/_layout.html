<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>honey — admin</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/admin.css" />
  <script>
    // Restore theme before paint to avoid flash.
    (function () {
      var t = localStorage.getItem('theme') || 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  {% set active = active_page or 'dashboard' %}
  <header class="admin-header">
    <div class="admin-bar">
      <div class="admin-bar-brand">
        <span class="admin-bar-prompt">root@honey:~$</span>
        <span class="admin-bar-title">./admin.sh<span class="admin-bar-blink">_</span></span>
      </div>
      <nav class="admin-nav">
        <a href="{{ url_for('admin.dashboard') }}" class="{{ 'active' if active == 'dashboard' }}" data-i18n="a.nav.dashboard">dashboard</a>
        <a href="{{ url_for('admin.peers') }}" class="{{ 'active' if active == 'peers' }}" data-i18n="a.nav.peers">peers</a>
        <a href="{{ url_for('admin.pending') }}" class="{{ 'active' if active == 'pending' }}" data-i18n="a.nav.pending">pending</a>
      </nav>
      <div class="admin-bar-right">
        <a href="/" class="admin-back" data-i18n="a.nav.stats">← stats</a>
        <form method="post" action="{{ url_for('admin.logout') }}" class="admin-logout-form">
          <button type="submit" class="admin-back" title="Log out" data-i18n="a.nav.logout">logout</button>
        </form>
        <div class="lang-tabs">
          <button class="lang-tab" data-lang="en">EN</button>
          <button class="lang-tab" data-lang="pt">PT</button>
        </div>
        <button class="admin-icon-btn" id="admin-theme-btn" title="Toggle theme">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  {% set msg = request.args.get('m') %}
  {% set err = request.args.get('e') %}
  {% if msg or err %}
  <div class="admin-flash {{ 'admin-flash-err' if err else 'admin-flash-ok' }}">
    {{ err or msg }}
  </div>
  {% endif %}

  <main class="admin-main">
    {% block content %}{% endblock %}
  </main>

  <script src="/static/js/admin-i18n.js"></script>
  <script>
    document.getElementById('admin-theme-btn').addEventListener('click', function () {
      var root = document.documentElement;
      var next = root.dataset.theme === 'dark' ? 'light' : 'dark';
      root.dataset.theme = next;
      localStorage.setItem('theme', next);
    });
  </script>
</body>
</html>
