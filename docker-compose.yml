name: autopot

services:
  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data
    entrypoint: ["/bin/bash", "/docker-entrypoint-custom.sh"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/entrypoint.sh:/docker-entrypoint-custom.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=${POSTGRES_PASSWORD} psql -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c 'SELECT 1' -q -t"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-init:
    image: postgres:17
    network_mode: host
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["psql"]
    command: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:${POSTGRES_PORT}/${POSTGRES_DB} -f /schema.sql"
    volumes:
      - ./postgres/schema.sql:/schema.sql:ro
    restart: "no"

  cowrie:
    build: ./cowrie
    container_name: cowrie
    restart: unless-stopped
    network_mode: host
    env_file: .env
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    volumes:
      - ./config/cowrie.cfg:/tmp/cowrie.cfg.template:ro
      - ./cowrie/var/log/cowrie:/cowrie/cowrie-git/var/log/cowrie
      - ./cowrie/var/lib/cowrie:/cowrie/cowrie-git/var/lib/cowrie

  # GeoIP database downloader (Rust port of geoip-init.sh) — runs once
  geoip-init:
    build:
      context: ./honey
    restart: "no"
    environment:
      - GEOIP_DIR=/geoip
      - RUST_LOG=${RUST_LOG:-info}
    volumes:
      - geoip:/geoip
    command: ["init", "geoip"]

  # Stats generator (Rust port of generate-stats.py) — runs on startup then every 5 min
  honey-jobs-stats:
    build:
      context: ./honey
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-127.0.0.1}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - STATS_DIR=/stats
      - WORDLIST_DIR=/wordlists
      - GEOIP_COUNTRY_DB=/geoip/country.mmdb
      - GEOIP_ASN_DB=/geoip/asn.mmdb
      - RUST_LOG=${RUST_LOG:-info}
    volumes:
      - stats:/stats
      - wordlists:/wordlists:ro
      - geoip:/geoip:ro
    command: ["jobs", "stats", "--loop"]
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      geoip-init:
        condition: service_completed_successfully

  # Bloom filter builder (Rust port of bloom-init.py) — runs once
  bloom-init:
    build:
      context: ./honey
    restart: "no"
    network_mode: host
    environment:
      - BLOOM_DIR=/bloom
      - RUST_LOG=${RUST_LOG:-info}
      # Space-separated URLs; downloaded one at a time to minimise disk usage.
      # Lists: xato-net 1 M, NCSC 100 k, Pwdb top 1 M, probable top 12 k, darkweb 2017 top 10 k.
      - BLOOM_WORDLIST_URLS=${BLOOM_WORDLIST_URLS:-https://raw.githubusercontent.com/danielmiessler/SecLists/master/Passwords/Common-Credentials/xato-net-10-million-passwords-1000000.txt https://raw.githubusercontent.com/danielmiessler/SecLists/master/Passwords/Common-Credentials/100k-most-used-passwords-NCSC.txt https://raw.githubusercontent.com/danielmiessler/SecLists/master/Passwords/Common-Credentials/Pwdb_top-1000000.txt https://raw.githubusercontent.com/danielmiessler/SecLists/master/Passwords/Common-Credentials/probable-v2_top-12000.txt https://raw.githubusercontent.com/danielmiessler/SecLists/master/Passwords/Common-Credentials/darkweb2017_top-10000.txt}
    volumes:
      - bloom:/bloom
    command: ["init", "bloom"]

  # Wordlist generator (Rust port of generate-wordlists.py)
  honey-jobs-wordlist:
    build:
      context: ./honey
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-127.0.0.1}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - WORDLIST_DIR=/wordlists
      - BLOOM_DIR=/bloom
      - RUST_LOG=${RUST_LOG:-info}
    volumes:
      - wordlists:/wordlists
      - bloom:/bloom:ro
    command: ["jobs", "wordlists", "--loop"]
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      bloom-init:
        condition: service_completed_successfully

  # Federation daemon — peer-to-peer wordlist exchange + admin loopback API
  honey-federation:
    build:
      context: ./honey
    container_name: honey-federation
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-127.0.0.1}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - HONEY_DATA_DIR=/data/honey
      - HONEY_NODE_NAME=${HONEY_NODE_NAME:-}
      - HONEY_CONTACT=${HONEY_CONTACT:-}
      - HONEY_FEDERATION_BIND=${HONEY_FEDERATION_BIND:-127.0.0.1:8088}
      - HONEY_PUBLIC_URL=${HONEY_PUBLIC_URL:-http://127.0.0.1:8088}
      - HONEY_POLL_INTERVAL_SECS=${HONEY_POLL_INTERVAL_SECS:-10}
      - RUST_LOG=${RUST_LOG:-info}
    volumes:
      - honey-data:/data/honey
    command: ["federation", "daemon"]
    depends_on:
      postgres-init:
        condition: service_completed_successfully

  # Stats dashboard — cowrie attack data from PostgreSQL, behind reCAPTCHA
  web:
    build: ./web
    container_name: web
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-127.0.0.1}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - RECAPTCHA_SITE_KEY=${RECAPTCHA_SITE_KEY}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY}
      - WORDLIST_DIR=/wordlists
      - STATS_DIR=/stats
    volumes:
      - wordlists:/wordlists
      - stats:/stats
    depends_on:
      postgres:
        condition: service_healthy

  # Nginx — routes port 80/443 by Host header
  nginx:
    build: ./nginx
    container_name: nginx
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      - TARGET_HOST=${TARGET_HOST}
      - HONEY_ADMIN_USER=${HONEY_ADMIN_USER:-}
      - HONEY_ADMIN_PASSWORD_HASH=${HONEY_ADMIN_PASSWORD_HASH:-}
    volumes:
      - ./letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - web
      - honey-federation

  # Certbot — automatic certificate renewal (runs every 12 h)
  certbot:
    image: certbot/certbot
    network_mode: host
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot --webroot-path /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"

volumes:
  postgres-data:
  wordlists:
  stats:
  bloom:
  geoip:
  honey-data:
